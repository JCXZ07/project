<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>always yours - cy</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Playfair+Display:ital@0;1&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #050508;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Cormorant Garamond', serif;
            color: #ffffff;
        }

        /* Ambient Dark Background */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a1528 0%, #050508 100%);
            z-index: 1;
        }

        /* Particles canvas */
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* 3D Book Container */
        .book-container {
            position: relative;
            width: 420px;
            height: 580px;
            z-index: 3;
            perspective: 2000px;
        }

        .book {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 
                        0 0 30px rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        /* Individual Pages */
        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            transform-origin: left center;
            transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1);
            cursor: pointer;
            border-radius: 0 6px 6px 0;
        }

        /* Front and Back of Each Page - Black & Dark Tones */
        .page-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background: linear-gradient(135deg, #141416 0%, #0b0b0d 100%);
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-left: 3px solid rgba(255, 255, 255, 0.15);
            border-radius: 0 6px 6px 0;
        }

        /* Spine Shadow Overlay */
        .page-face::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 25px;
            height: 100%;
            background: linear-gradient(to right, rgba(0, 0, 0, 0.6), transparent);
            pointer-events: none;
        }

        .page-back {
            transform: rotateY(180deg);
            background: linear-gradient(-135deg, #18181b 0%, #0f0f12 100%);
            border-radius: 6px 0 0 6px;
        }

        .page-back::before {
            left: auto;
            right: 0;
            background: linear-gradient(to left, rgba(0, 0, 0, 0.6), transparent);
        }

        /* Flipped State */
        .page.flipped {
            transform: rotateY(-180deg);
        }

        /* Cover Page Styling */
        .cover {
            background: linear-gradient(135deg, #0d0d12 0%, #030305 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .cover h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
            text-transform: lowercase;
        }

        .cover p {
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.6;
        }

        .cover .click-hint {
            position: absolute;
            bottom: 40px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            opacity: 0.4;
            text-transform: none;
            font-style: italic;
            animation: pulse 2s infinite;
        }

        /* Typography Inside Pages */
        .quote {
            font-size: 1.35rem;
            line-height: 1.8;
            color: #f0f0f2;
            font-weight: 300;
            white-space: pre-line;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.15);
        }

        .date-quote {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            letter-spacing: 4px;
            color: #e0e0e5;
        }

        .page-number {
            position: absolute;
            bottom: 25px;
            font-size: 0.8rem;
            color: #666670;
            letter-spacing: 1px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.7; }
        }

        @media (max-width: 480px) {
            .book-container {
                width: 320px;
                height: 480px;
            }
            .quote {
                font-size: 1.15rem;
            }
        }
    </style>
</head>
<body>

    <div class="background"></div>
    <canvas id="canvas"></canvas>

    <!-- Audio Element targeting mysong.mp3 -->
    <audio id="bgMusic" src="mysong.mp3" preload="auto" loop></audio>

    <div class="book-container">
        <div class="book" id="book"></div>
    </div>

    <script>
        const quotes = [
            "17/09/26",
            "If you find this far in the future, i left\nthis was my reverence.\n\ndearest, xina",
            "There may come a morning\nwhen the ghost of my touch\nwill linger on your skin",
            "When your hands may reach\nand closes on air and dust",
            "I will be the past rooms and spaces where our feelings and moments are stored,\nthe hallways, paths, and roads that we walked together,\nthe final quiet rest when a voice no longer answers back",
            "Like being far beneath your feet, I am resting quietly and blankly, covered by the passage of time i am a dormant seed",
            "Do not find me to validate our past. You are the evidence. There are things your hands remember simply because they once knew the name of mine",
            "To live is to carry the ghosts of people who are still breathing.",
            "If i wake again, tell me everything you've been through",
            "Tell me the days that I ran in your thoughts and tell me when he rested",
            "And if I don't, when you forget my voice, and my smile",
            "Let me rest on my grave behind your eyes, where the days we became one sleeps peacefully,\nquiet but never gone.",
            "But if you find this while our hearts still yearn",
            "Keep me",
            "Reach out to me, because I really don't want to leave.",
            "Fuck everything I said, please fucking stay.",
            "I still want to have random side quests with you",
            "I still want to wait for you until 7:15am",
            "I still want to hold my cases for an hour just to have lunch with you",
            "I still want to ragebait you every fucking day",
            "I don't know if i'm even making sense right now",
            "You're all I ever wanted",
            "This song fucking represents what I feel for you, why'd you have to steal that huh?",
            "Please come back, princess",
            "If you do, I promise that I'll give you a thousand kisses",
            "I love you, madam baby"
        ];

        const book = document.getElementById('book');
        const audio = document.getElementById('bgMusic');
        let musicStarted = false;

        function createBook() {
            // Cover Page
            const coverPage = document.createElement('div');
            coverPage.className = 'page';
            coverPage.style.zIndex = quotes.length + 2;
            coverPage.innerHTML = `
                <div class="page-face cover">
                    <h1>For your eyes only</h1>
                    <p>Dearest, Xina</p>
                    <span class="click-hint">click to open</span>
                </div>
                <div class="page-face page-back"></div>
            `;
            book.appendChild(coverPage);

            // Quote Pages
            quotes.forEach((text, index) => {
                const page = document.createElement('div');
                page.className = 'page';
                page.style.zIndex = quotes.length - index;

                const isDate = index === 0;
                const quoteClass = isDate ? 'quote date-quote' : 'quote';

                page.innerHTML = `
                    <div class="page-face">
                        <div class="${quoteClass}">${text}</div>
                        <div class="page-number">- ${index + 1} -</div>
                    </div>
                    <div class="page-face page-back"></div>
                `;
                book.appendChild(page);
            });
        }

        createBook();

        const pages = document.querySelectorAll('.page');
        let currentPageIndex = 0;

        pages.forEach((page, index) => {
            page.addEventListener('click', () => {
                // Play custom mysong.mp3 on first click
                if (!musicStarted) {
                    audio.play().catch(err => console.log("Audio playback waiting for interaction:", err));
                    musicStarted = true;
                }

                if (index === currentPageIndex) {
                    page.classList.add('flipped');
                    setTimeout(() => {
                        page.style.zIndex = index + 1;
                    }, 300);
                    currentPageIndex++;
                } else if (index === currentPageIndex - 1) {
                    page.classList.remove('flipped');
                    page.style.zIndex = quotes.length + 2 - index;
                    currentPageIndex--;
                }
            });
        });

        // Background Particles
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.8 + 0.3;
                this.vx = (Math.random() - 0.5) * 0.2;
                this.vy = -Math.random() * 0.25 - 0.05;
                this.alpha = Math.random() * 0.4 + 0.1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.y < 0 || this.x < 0 || this.x > canvas.width) {
                    this.reset();
                    this.y = canvas.height;
                }
            }

            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        const particles = Array.from({ length: 60 }, () => new Particle());

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        animateParticles();
    </script>
</body>
</html>
