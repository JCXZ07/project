<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Letter for You</title>
  <link rel="stylesheet" href="style.css">
  <!-- PageFlip Library CDN -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
</head>
<body>

  <div class="container">
    <div id="book">
      
      <!-- Cover -->
      <div class="page page-cover" data-density="hard">
        <div class="page-content">
          <h2>For My Favorite Person</h2>
          <p>Tap to open ♥</p>
        </div>
      </div>

      <!-- Page 1 -->
      <div class="page">
        <div class="page-content">
          <p class="letter-text">
            My dearest,<br><br>
            I wanted to create something small to remind you how much you mean to me...
          </p>
        </div>
      </div>

      <!-- Page 2 -->
      <div class="page">
        <div class="page-content">
          <p class="letter-text">
            Every day with you feels like a quiet blessing. Thank you for being my light, my laugh, and my home.
          </p>
        </div>
      </div>

      <!-- Back Cover -->
      <div class="page page-cover" data-density="hard">
        <div class="page-content">
          <h3>Forever Yours,</h3>
          <p>♥</p>
        </div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
