<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Always Yours, Never Mine</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --night: #050509;
            --deep-purple: #100c18;
            --wine: #24121d;
            --rose: #c98f9d;
            --rose-soft: #e6b7c0;
            --paper: #17151a;
            --paper-light: #211d23;
            --text: #eee6e8;
            --muted: #8f8288;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background:
                radial-gradient(
                    ellipse at center,
                    #211522 0%,
                    #100b15 38%,
                    #050509 78%
                );

            color: var(--text);

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            font-family: "Cormorant Garamond", serif;
        }

        /* --------------------------------
           ATMOSPHERIC BACKGROUND
        -------------------------------- */

        .background {
            position: fixed;
            inset: 0;
            z-index: 0;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(132, 71, 95, 0.16),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 20% 80%,
                    rgba(83, 50, 100, 0.12),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 20%,
                    rgba(151, 86, 103, 0.08),
                    transparent 28%
                );

            pointer-events: none;
        }

        .background::after {
            content: "";
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    rgba(255,255,255,0.015) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.012) 1px,
                    transparent 1px
                );

            background-size: 70px 70px;

            mask-image: radial-gradient(
                ellipse at center,
                black,
                transparent 75%
            );
        }

        /* Vignette */

        .vignette {
            position: fixed;
            inset: 0;
            z-index: 5;

            pointer-events: none;

            background:
                radial-gradient(
                    ellipse at center,
                    transparent 45%,
                    rgba(0,0,0,0.45) 100%
                );
        }

        /* --------------------------------
           PARTICLES
        -------------------------------- */

        #canvas {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            z-index: 1;

            pointer-events: none;
        }

        /* --------------------------------
           BOOK
        -------------------------------- */

        .book-container {
            position: relative;

            width: 430px;
            height: 600px;

            z-index: 10;

            perspective: 2200px;
        }

        .book {
            position: relative;

            width: 100%;
            height: 100%;

            transform-style: preserve-3d;

            filter:
                drop-shadow(0 35px 40px rgba(0,0,0,0.75))
                drop-shadow(0 0 35px rgba(194,118,139,0.08));
        }

        /* --------------------------------
           PAGES
        -------------------------------- */

        .page {
            position: absolute;

            width: 100%;
            height: 100%;

            top: 0;
            left: 0;

            transform-origin: left center;
            transform-style: preserve-3d;

            transition:
                transform 1.35s cubic-bezier(0.645, 0.045, 0.355, 1);

            cursor: pointer;

            border-radius: 0 10px 10px 0;

            will-change: transform;
        }

        .page-face {
            position: absolute;

            width: 100%;
            height: 100%;

            backface-visibility: hidden;

            overflow: hidden;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            padding: 55px 52px;

            text-align: center;

            border:
                1px solid rgba(255,255,255,0.09);

            border-left:
                2px solid rgba(255,255,255,0.12);

            border-radius: 0 10px 10px 0;

            background:
                linear-gradient(
                    135deg,
                    rgba(37,31,39,0.98),
                    rgba(13,12,17,0.99)
                );

            box-shadow:
                inset 15px 0 30px rgba(0,0,0,0.18),
                inset -8px 0 25px rgba(0,0,0,0.25);
        }

        /* Paper grain */

        .page-face::after {
            content: "";

            position: absolute;
            inset: 0;

            pointer-events: none;

            opacity: 0.18;

            background-image:
                radial-gradient(
                    rgba(255,255,255,0.25) 0.5px,
                    transparent 0.6px
                );

            background-size: 5px 5px;

            mix-blend-mode: soft-light;
        }

        /* Spine shadow */

        .page-face::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 45px;
            height: 100%;

            background:
                linear-gradient(
                    to right,
                    rgba(0,0,0,0.55),
                    rgba(0,0,0,0)
                );

            pointer-events: none;

            z-index: 2;
        }

        .page-back {
            transform: rotateY(180deg);

            border-radius: 10px 0 0 10px;

            background:
                linear-gradient(
                    -135deg,
                    #211c22,
                    #100f13
                );
        }

        .page-back::before {
            left: auto;
            right: 0;

            background:
                linear-gradient(
                    to left,
                    rgba(0,0,0,0.5),
                    transparent
                );
        }

        .page.flipped {
            transform: rotateY(-180deg);
        }

        /* --------------------------------
           COVER
        -------------------------------- */

        .cover {
            position: relative;

            background:
                radial-gradient(
                    circle at 50% 42%,
                    rgba(157,84,108,0.18),
                    transparent 34%
                ),
                linear-gradient(
                    145deg,
                    #19131b,
                    #07070b
                );

            border:
                1px solid rgba(215,159,173,0.22);

            box-shadow:
                inset 0 0 70px rgba(0,0,0,0.6);
        }

        .cover-decoration {
            position: absolute;

            width: 245px;
            height: 245px;

            border:
                1px solid rgba(201,143,157,0.25);

            transform: rotate(45deg);

            opacity: 0.65;
        }

        .cover-decoration::before,
        .cover-decoration::after {
            content: "";

            position: absolute;

            inset: 20px;

            border:
                1px solid rgba(201,143,157,0.13);
        }

        .cover-decoration::after {
            inset: 45px;
        }

        .cover-content {
            position: relative;

            z-index: 3;

            display: flex;
            flex-direction: column;

            align-items: center;
        }

        .small-line {
            width: 45px;
            height: 1px;

            background:
                linear-gradient(
                    to right,
                    transparent,
                    var(--rose),
                    transparent
                );

            margin-bottom: 25px;

            opacity: 0.75;
        }

        .cover h1 {
            font-family: "Playfair Display", serif;

            font-size: 2.15rem;

            font-weight: 400;

            letter-spacing: 2px;

            color: #f4e9eb;

            text-shadow:
                0 0 25px rgba(220,155,170,0.18);
        }

        .cover-script {
            margin-top: 20px;

            font-family: "Great Vibes", cursive;

            font-size: 2rem;

            color: var(--rose-soft);

            opacity: 0.9;
        }

        .cover-subtitle {
            margin-top: 20px;

            font-family: "Playfair Display", serif;

            font-size: 0.72rem;

            letter-spacing: 4px;

            text-transform: uppercase;

            color: #97858b;

            font-style: normal;
        }

        .cover-heart {
            margin-top: 30px;

            color: var(--rose);

            font-size: 17px;

            opacity: 0.75;

            animation: heartbeat 3s ease-in-out infinite;
        }

        .click-hint {
            position: absolute;

            bottom: 38px;

            font-size: 0.85rem;

            letter-spacing: 1.5px;

            color: #85777d;

            font-style: italic;

            animation: breathe 2.5s ease-in-out infinite;
        }

        /* --------------------------------
           LETTER TYPOGRAPHY
        -------------------------------- */

        .quote {
            position: relative;

            z-index: 3;

            max-width: 330px;

            font-size: 1.34rem;

            line-height: 1.78;

            font-weight: 300;

            color: #eee6e8;

            white-space: pre-line;

            text-shadow:
                0 1px 1px rgba(0,0,0,0.6);

            letter-spacing: 0.15px;
        }

        .quote::first-letter {
            color: var(--rose-soft);
        }

        .date-quote {
            font-family: "Playfair Display", serif;

            font-size: 1.4rem;

            letter-spacing: 5px;

            color: var(--rose-soft);
        }

        .signature {
            font-family: "Great Vibes", cursive;

            font-size: 2rem;

            color: var(--rose-soft);

            margin-top: 25px;
        }

        .page-number {
            position: absolute;

            z-index: 4;

            bottom: 23px;

            font-family: "Playfair Display", serif;

            font-size: 0.65rem;

            letter-spacing: 3px;

            color: #625960;
        }

        /* --------------------------------
           LITTLE ORNAMENT
        -------------------------------- */

        .ornament {
            position: absolute;

            top: 34px;

            left: 50%;

            transform: translateX(-50%);

            color: rgba(201,143,157,0.55);

            font-size: 11px;

            letter-spacing: 7px;

            z-index: 4;
        }

        /* --------------------------------
           PROGRESS
        -------------------------------- */

        .progress {
            position: fixed;

            z-index: 20;

            bottom: 24px;
            left: 50%;

            transform: translateX(-50%);

            display: flex;

            align-items: center;

            gap: 8px;

            opacity: 0.6;
        }

        .progress-dot {
            width: 4px;
            height: 4px;

            border-radius: 50%;

            background: #675860;

            transition:
                transform 0.4s ease,
                background 0.4s ease;
        }

        .progress-dot.active {
            width: 6px;
            height: 6px;

            background: var(--rose);

            box-shadow:
                0 0 8px rgba(201,143,157,0.5);
        }

        /* --------------------------------
           NAVIGATION HINT
        -------------------------------- */

        .navigation {
            position: fixed;

            z-index: 20;

            top: 50%;

            width: min(650px, 90vw);

            display: flex;

            justify-content: space-between;

            transform: translateY(-50%);

            pointer-events: none;

            color: #74666c;

            font-size: 0.75rem;

            letter-spacing: 2px;

            text-transform: uppercase;

            opacity: 0;

            transition: opacity 0.6s ease;
        }

        .navigation.visible {
            opacity: 0.5;
        }

        /* --------------------------------
           ANIMATIONS
        -------------------------------- */

        @keyframes breathe {
            0%, 100% {
                opacity: 0.3;
                transform: translateY(0);
            }

            50% {
                opacity: 0.8;
                transform: translateY(-3px);
            }
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            15% {
                transform: scale(1.15);
            }

            30% {
                transform: scale(1);
            }

            45% {
                transform: scale(1.08);
            }

            60% {
                transform: scale(1);
            }
        }

        /* --------------------------------
           RESPONSIVE
        -------------------------------- */

        @media (max-width: 600px) {

            body {
                padding: 20px;
            }

            .book-container {
                width: min(88vw, 370px);
                height: min(132vw, 530px);
            }

            .page-face {
                padding: 45px 34px;
            }

            .cover h1 {
                font-size: 1.7rem;
            }

            .cover-script {
                font-size: 1.75rem;
            }

            .quote {
                font-size: 1.17rem;
                line-height: 1.7;
                max-width: 290px;
            }

            .date-quote {
                font-size: 1.15rem;
            }

            .navigation {
                display: none;
            }

            .progress {
                bottom: 15px;
            }
        }

        @media (max-height: 700px) and (min-width: 601px) {

            .book-container {
                width: 360px;
                height: 510px;
            }

            .quote {
                font-size: 1.18rem;
            }

            .page-face {
                padding: 40px 38px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <div class="background"></div>

    <canvas id="canvas"></canvas>

    <div class="vignette"></div>

    <!-- Your music -->
    <audio
        id="bgMusic"
        src="mysong.mp3"
        preload="auto"
        loop>
    </audio>

    <div class="book-container">
        <div class="book" id="book"></div>
    </div>

    <div class="navigation" id="navigation">
        <span>← previous</span>
        <span>next →</span>
    </div>

    <div class="progress" id="progress"></div>


    <script>

        /* ==========================================
           LETTER CONTENT
        ========================================== */

        const quotes = [

            "17 / 09 / 26",

            `If you find this far in the future,
if I have left,

this was my reverence.

Dearest, Xina.`,

            `There may come a morning
when the ghost of my touch
will linger upon your skin.`,

            `When your hands may reach
and close upon nothing
but air and dust.`,

            `I will be the rooms and spaces
where our feelings and moments are stored;

the hallways, paths, and roads
that we once walked together;

the final, quiet rest
when a voice no longer answers back.`,

            `Like being far beneath your feet,
I will be resting quietly and blankly,
covered by the passage of time.

I am a dormant seed.`,

            `Do not find me
to validate our past.

You are the evidence.`,

            `There are things
your hands remember

simply because
they once knew the name of mine.`,

            `If I wake again,
tell me everything
you have been through.`,

            `Tell me about the days
when I ran through your thoughts,

and tell me
when he rested.`,

            `And if I do not,

when you forget my voice,
when you forget my smile,

I hope some small part of me
still remains in the quiet places
of your memory.`,

            `Let me rest on my grave
behind your eyes,

where the days
when we became one
sleep peacefully.`,

            `Quiet.`,

            `But never away.`

        ];


        /* ==========================================
           BOOK CREATION
        ========================================== */

        const book = document.getElementById("book");
        const audio = document.getElementById("bgMusic");
        const progress = document.getElementById("progress");
        const navigation = document.getElementById("navigation");

        let musicStarted = false;
        let currentPageIndex = 0;


        function createBook() {

            /*
             * COVER
             */

            const coverPage = document.createElement("div");

            coverPage.className = "page";

            coverPage.style.zIndex = quotes.length + 2;

            coverPage.innerHTML = `

                <div class="page-face cover">

                    <div class="cover-decoration"></div>

                    <div class="cover-content">

                        <div class="small-line"></div>

                        <h1>For Your Eyes Only</h1>

                        <div class="cover-script">
                            Dearest, Xina
                        </div>

                        <div class="cover-subtitle">
                            A letter that stayed
                        </div>

                        <div class="cover-heart">
                            ♥
                        </div>

                    </div>

                    <span class="click-hint">
                        click to open
                    </span>

                </div>

                <div class="page-face page-back"></div>
            `;

            book.appendChild(coverPage);


            /*
             * LETTER PAGES
             */

            quotes.forEach((text, index) => {

                const page = document.createElement("div");

                page.className = "page";

                page.style.zIndex = quotes.length - index;


                const isDate = index === 0;

                const quoteClass =
                    isDate
                        ? "quote date-quote"
                        : "quote";


                /*
                 * Add a signature-style ending
                 * to the final page.
                 */

                let extra = "";

                if (index === quotes.length - 1) {

                    extra = `
                        <div class="signature">
                            — always
                        </div>
                    `;
                }


                page.innerHTML = `

                    <div class="page-face">

                        <div class="ornament">
                            · · ·
                        </div>

                        <div class="${quoteClass}">
                            ${text}
                        </div>

                        ${extra}

                        <div class="page-number">
                            ${String(index + 1).padStart(2, "0")}
                        </div>

                    </div>

                    <div class="page-face page-back"></div>
                `;

                book.appendChild(page);
            });
        }


        createBook();


        const pages = document.querySelectorAll(".page");


        /* ==========================================
           PROGRESS INDICATORS
        ========================================== */

        function createProgress() {

            progress.innerHTML = "";

            /*
             * Cover + letter pages
             */

            for (let i = 0; i <= quotes.length; i++) {

                const dot =
                    document.createElement("div");

                dot.className = "progress-dot";

                if (i === 0) {
                    dot.classList.add("active");
                }

                progress.appendChild(dot);
            }
        }


        createProgress();


        function updateProgress() {

            const dots =
                document.querySelectorAll(".progress-dot");

            dots.forEach((dot, index) => {

                dot.classList.toggle(
                    "active",
                    index === currentPageIndex
                );
            });


            /*
             * Show navigation after the cover.
             */

            if (currentPageIndex > 0) {
                navigation.classList.add("visible");
            } else {
                navigation.classList.remove("visible");
            }
        }


        /* ==========================================
           MUSIC
        ========================================== */

        function startMusic() {

            if (musicStarted) return;

            audio.volume = 0.45;

            audio.play()
                .then(() => {
                    musicStarted = true;
                })
                .catch(() => {
                    /*
                     * Some browsers may still block
                     * autoplay. The next interaction
                     * will try again.
                     */
                });
        }


        /* ==========================================
           PAGE TURNING
        ========================================== */

        function turnPage(index) {

            if (index === currentPageIndex) {

                const page = pages[index];

                if (!page) return;

                page.classList.add("flipped");

                setTimeout(() => {

                    page.style.zIndex = index + 1;

                }, 400);

                currentPageIndex++;

                updateProgress();

                startMusic();
            }

            else if (index === currentPageIndex - 1) {

                const page = pages[index];

                if (!page) return;

                page.classList.remove("flipped");

                page.style.zIndex =
                    quotes.length + 2 - index;

                currentPageIndex--;

                updateProgress();
            }
        }


        pages.forEach((page, index) => {

            page.addEventListener("click", () => {

                turnPage(index);

            });

        });


        /* ==========================================
           KEYBOARD CONTROLS
        ========================================== */

        document.addEventListener("keydown", (event) => {

            if (
                event.key === "ArrowRight" ||
                event.key === " " ||
                event.key === "Enter"
            ) {

                event.preventDefault();

                if (currentPageIndex < pages.length) {

                    turnPage(currentPageIndex);
                }
            }


            if (event.key === "ArrowLeft") {

                event.preventDefault();

                if (currentPageIndex > 0) {

                    turnPage(currentPageIndex - 1);
                }
            }

        });


        /* ==========================================
           TOUCH SWIPING
        ========================================== */

        let touchStartX = 0;

        document.addEventListener("touchstart", (event) => {

            touchStartX =
                event.changedTouches[0].screenX;

        }, { passive: true });


        document.addEventListener("touchend", (event) => {

            const touchEndX =
                event.changedTouches[0].screenX;

            const distance =
                touchEndX - touchStartX;


            if (Math.abs(distance) < 50) return;


            if (distance < 0) {

                if (currentPageIndex < pages.length) {

                    turnPage(currentPageIndex);
                }

            } else {

                if (currentPageIndex > 0) {

                    turnPage(currentPageIndex - 1);
                }
            }

        }, { passive: true });


        /* ==========================================
           FLOATING PARTICLES
        ========================================== */

        const canvas =
            document.getElementById("canvas");

        const ctx =
            canvas.getContext("2d");


        function resizeCanvas() {

            const ratio =
                Math.min(window.devicePixelRatio || 1, 2);

            canvas.width =
                window.innerWidth * ratio;

            canvas.height =
                window.innerHeight * ratio;

            canvas.style.width =
                window.innerWidth + "px";

            canvas.style.height =
                window.innerHeight + "px";

            ctx.setTransform(
                ratio,
                0,
                0,
                ratio,
                0,
                0
            );
        }


        resizeCanvas();

        window.addEventListener(
            "resize",
            resizeCanvas
        );


        class Particle {

            constructor() {
                this.reset(true);
            }


            reset(initial = false) {

                this.x =
                    Math.random() * window.innerWidth;

                this.y =
                    initial
                        ? Math.random() * window.innerHeight
                        : window.innerHeight + 10;

                this.size =
                    Math.random() * 1.5 + 0.3;

                this.speed =
                    Math.random() * 0.25 + 0.05;

                this.drift =
                    (Math.random() - 0.5) * 0.15;

                this.alpha =
                    Math.random() * 0.35 + 0.05;

                this.twinkle =
                    Math.random() * 0.02 + 0.005;
            }


            update() {

                this.y -= this.speed;

                this.x += this.drift;

                this.alpha +=
                    Math.sin(Date.now() * this.twinkle)
                    * 0.002;


                if (
                    this.y < -10 ||
                    this.x < -20 ||
                    this.x > window.innerWidth + 20
                ) {

                    this.reset();
                }
            }


            draw() {

                ctx.beginPath();

                ctx.arc(
                    this.x,
                    this.y,
                    this.size,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle =
                    `rgba(232, 193, 202, ${Math.max(
                        0.02,
                        this.alpha
                    )})`;

                ctx.fill();
            }
        }


        const particles =
            Array.from(
                { length: 85 },
                () => new Particle()
            );


        function animateParticles() {

            ctx.clearRect(
                0,
                0,
                window.innerWidth,
                window.innerHeight
            );


            particles.forEach((particle) => {

                particle.update();

                particle.draw();

            });


            requestAnimationFrame(
                animateParticles
            );
        }


        animateParticles();

    </script>

</body>
</html>
